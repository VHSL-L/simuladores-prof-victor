<!doctype html>
<html lang="pt-BR">
<meta charset="UTF-8" />
<title>Verificação mobile — somente desenvolvimento</title>
<style>body{margin:12px;font-family:system-ui;background:#ddd}iframe{display:block;width:390px;height:844px;border:1px solid #888;margin-bottom:24px}h2{font-size:16px}</style>
<h2>Plataforma · 390 × 844</h2>
<iframe src="/" title="Plataforma mobile"></iframe>
<h2>Choque · 390 × 844</h2>
<iframe src="/simulators/choque/index.html" title="Choque mobile"></iframe>
<h2>Ventilação · 390 × 844</h2>
<iframe src="/simulators/ventilacao-mecanica/index.html" title="Ventilação mobile"></iframe>
<script>
  // Optional focused view for browser checks. This file is not a build entry.
  const selected = new URLSearchParams(location.search).get('module');
  const choices = { platform: 0, choque: 1, ventilacao: 2 };
  if (selected in choices) {
    document.querySelectorAll('iframe').forEach((frame, index) => {
      if (index !== choices[selected]) {
        frame.previousElementSibling.remove();
        frame.remove();
      }
    });
  }
</script>
</html>
